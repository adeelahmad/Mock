# Release: push a tag like v0.1.0 and this builds the Mock binary for linux and darwin
# (amd64, arm64) with the web app embedded, plus prebuilt Proxmox LXC templates (Debian 13,
# amd64 and arm64), and publishes them with checksums as a GitHub Release. install.sh and
# proxmox/ct/mock.sh download from the latest release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Pull requests that touch the LXC build run everything except the publish step.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'proxmox/**'
      - 'Makefile'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && format('pr{0}', github.event.number)) || github.ref_name }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: go vet ./...
      # Builds the web app, embeds it, and cross-compiles bin/mock-{linux,darwin}-{amd64,arm64}.
      - run: make binaries VERSION="$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/mock-*
          if-no-files-found: error

  # Debian 13 rootfs from mmdebstrap with the binary, Caddy and the first-boot unit, as .tar.zst.
  # Each architecture builds on its own runner, then boots under systemd-nspawn as a smoke test.
  lxc:
    needs: binaries
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin
      - run: chmod +x bin/mock-*
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mmdebstrap debian-archive-keyring systemd-container zstd
      - run: sudo VERSION="$TAG" OUT="$PWD/out" proxmox/lxc/build.sh ${{ matrix.arch }}
      - run: sudo proxmox/lxc/smoke.sh out/mock-lxc-debian13-${{ matrix.arch }}.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: lxc-${{ matrix.arch }}
          path: out/mock-lxc-*.tar.zst
          if-no-files-found: error

  publish:
    needs: [binaries, lxc]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum mock-* > checksums.txt && cat checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Mock $TAG" --generate-notes \
              $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi
