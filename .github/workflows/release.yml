# Release: push a tag like v0.1.0 and this builds the Mock binary for linux and darwin
# (amd64, arm64) with the web app embedded, and publishes them with checksums as a GitHub
# Release. install.sh downloads from the latest release.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: go vet ./...
      # Builds the web app, embeds it, and cross-compiles bin/mock-{linux,darwin}-{amd64,arm64}.
      - run: make binaries VERSION="$TAG"
      - run: cd bin && sha256sum mock-* > checksums.txt && cat checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bin/mock-* bin/checksums.txt --clobber
          else
            gh release create "$TAG" bin/mock-* bin/checksums.txt --title "Mock $TAG" --generate-notes \
              $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi
